services:
  # FastAPI Backend Web Service
  - type: web
    name: finance-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_HOURS
        value: "168"
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production

  # Next.js Frontend Web Service
  - type: web
    name: finance-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: finance-backend
          property: url

databases:
  - name: finance-db
    databaseName: finance_db
    user: finance_user
    plan: free
